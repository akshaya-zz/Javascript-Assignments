<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Akshaya Bank ATM</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/welcome.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="css/home.css">
    </head>
    <body>

        <!-- Welcome Screen -->
        <div id="screen-welcome" class="card">
            <i class="fa-solid fa-building-columns bank-icon"></i>
            <h1>Welcome to the Bank of Akshaya</h1>
            <p>Log in to get started.</p>
            <button class="btn" onclick="showLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Get Started</button>
        </div>

        <!-- Login Screen -->
        <div id="screen-login" class="card hidden">
            <i class="fa-solid fa-lock bank-icon"></i>
            <h1>Akshaya Bank</h1>
            <p>Enter your account details to continue.</p>
            <input type="text" id="accountNo" placeholder="Account Number" />
            <input type="password" id="pin" placeholder="PIN" />
            <button class="btn" onclick="validateUser()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            <div id="error-message"></div>
        </div>

        <!-- Home Screen -->
        <div id="screen-home" class="card hidden">
            <button id="btn-logout" class="btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            <i class="fa-solid fa-circle-user user-icon"></i>
            <p id="welcome-user"></p>
            <p id="account-type"></p>
            <div class="btn-grid">
                <button class="btn" onclick="showScreen('screen-withdraw')"><i class="fa-solid fa-money-bill-wave"></i> Withdraw</button>
                <button class="btn" onclick="showScreen('screen-balance')"><i class="fa-solid fa-wallet"></i> Balance</button>
                <button class="btn" onclick="showScreen('screen-deposit')"><i class="fa-solid fa-piggy-bank"></i> Deposit</button>
                <button class="btn" onclick="showScreen('screen-changepin')"><i class="fa-solid fa-key"></i> Change PIN</button>
            </div>
        </div>

        <!-- Balance Screen -->
        <div id="screen-balance" class="card hidden">
            <button class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <i class="fa-solid fa-wallet bank-icon"></i>
            <h2>Account Balance</h2>
            <p id="balance-amount" class="amount"></p>
            <p id="balance-type" class="sub"></p>
        </div>

        <!-- Withdraw Screen -->
        <div id="screen-withdraw" class="card hidden">
            <button class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <i class="fa-solid fa-money-bill-wave bank-icon"></i>
            <h2>Withdraw</h2>
            <div id="withdraw-form">
                <input type="number" id="withdraw-amount" placeholder="Enter amount" />
                <button class="btn" onclick="doWithdraw()"><i class="fa-solid fa-check"></i> Withdraw</button>
            </div>
            <p id="withdraw-msg" class="msg"></p>
        </div>

        <!-- Deposit Screen -->
        <div id="screen-deposit" class="card hidden">
            <button class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <i class="fa-solid fa-piggy-bank bank-icon"></i>
            <h2>Deposit</h2>
            <div id="deposit-form">
                <input type="number" id="deposit-amount" placeholder="Enter amount" />
                <button class="btn" onclick="doDeposit()"><i class="fa-solid fa-check"></i> Deposit</button>
            </div>
            <p id="deposit-msg" class="msg"></p>
        </div>

        <!-- Change PIN Screen -->
        <div id="screen-changepin" class="card hidden">
            <button class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <i class="fa-solid fa-key bank-icon"></i>
            <h2>Change PIN</h2>
            <div id="changepin-form">
                <input type="password" id="current-pin" placeholder="Current PIN" />
                <input type="password" id="new-pin" placeholder="New PIN" />
                <button class="btn" onclick="doChangePin()"><i class="fa-solid fa-check"></i> Update PIN</button>
            </div>
            <p id="changepin-msg" class="msg"></p>
        </div>

        <script src="js/User.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
